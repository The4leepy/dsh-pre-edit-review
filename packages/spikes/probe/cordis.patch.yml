# dpr-spike-probe bundle patch: mount the Phase 1.5 probe plugin.
#
# workspaceRoot is where the probe writes its evidence and the only tree in
# which `write` calls are intercepted.
- insert:
    - id: dpr-spike-probe
      name: dpr-spike-probe
      config:
        workspaceRoot: !!js process.env.DPR_SPIKE_WORKSPACE ?? process.cwd()
        enableIntercept: true
        shortCircuitContent: "S1-SHORT-CIRCUIT-OK\n"
